name: Build Solar Launcher

on:
  push:
    branches: ["main", "solar-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Wii U toolchain image
        run: docker build -t solar-launcher-builder .

      - name: Build SolarLauncher.wps
        run: docker run --rm -v "$PWD:/project" solar-launcher-builder make

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: SolarLauncher-wps
          path: SolarLauncher.wps
          if-no-files-found: error
