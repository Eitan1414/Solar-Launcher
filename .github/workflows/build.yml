name: Build Solar Launcher - Cuphead Player 3 Test 2

on:
  push:
    branches: ["cuphead-player3-test2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cuphead-player3-test2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Player 3 branch
        uses: actions/checkout@v7

      - name: Build Wii U toolchain image
        run: docker build -t solar-launcher-builder .

      - name: Build SolarLauncher.wps
        run: docker run --rm -v "$PWD:/project" solar-launcher-builder make

      - name: Upload Cuphead Player 3 Test 2 plugin
        uses: actions/upload-artifact@v7
        with:
          name: SolarLauncher-Cuphead-Player3-Test2-wps
          path: SolarLauncher.wps
          if-no-files-found: error
