name: Build Solar Launcher v0.5.1 Polish

on:
  push:
    branches: ["solar-launcher-v0.5.1-polish"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-solar-v051:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout polish branch
        uses: actions/checkout@v7

      - name: Build Wii U toolchain image
        run: docker build -t solar-launcher-builder .

      - name: Build SolarLauncher.wps
        run: docker run --rm -v "$PWD:/project" solar-launcher-builder make

      - name: Upload Solar Launcher v0.5.1 Polish
        uses: actions/upload-artifact@v7
        with:
          name: SolarLauncher-v0.5.1-Polish-wps
          path: SolarLauncher.wps
          if-no-files-found: error
