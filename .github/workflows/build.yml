name: Build Solar Launcher - Cuphead Test 1B All-in-One

on:
  push:
    branches: ["cuphead-test1b-verification"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cuphead-test1b:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v7

      - name: Build Wii U toolchain image
        run: docker build -t solar-launcher-builder .

      - name: Build SolarLauncher.wps
        run: docker run --rm -v "$PWD:/project" solar-launcher-builder make

      - name: Upload Cuphead Test 1B all-in-one plugin
        uses: actions/upload-artifact@v7
        with:
          name: SolarLauncher-Cuphead-Test1B-AllInOne-wps
          path: SolarLauncher.wps
          if-no-files-found: error
